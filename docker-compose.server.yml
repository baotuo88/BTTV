# 服务器端 Docker Compose 配置
# 用途：使用 Docker Hub 镜像部署，无需本地构建

name: bttv

services:
  # Next.js 应用（生产环境 - 使用远程镜像）
  app:
    image: ${DOCKER_USERNAME:-baotuo88}/bttv:${IMAGE_VERSION:-latest}
    container_name: bttv-app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ALLOW_REGISTER=${ALLOW_REGISTER:-true}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - LOCAL_DATA_DIR=/app/data
      - MONGODB_URI=${MONGODB_URI:-}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-}
      - NEXT_PUBLIC_DOUBAN_API_URL=${NEXT_PUBLIC_DOUBAN_API_URL:-}
    volumes:
      - bttv-data:/app/data
    networks:
      - bttv-network
    restart: unless-stopped

networks:
  bttv-network:
    driver: bridge

volumes:
  bttv-data:
    driver: local
